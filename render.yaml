# Render Blueprint for the backend service.
# Repository root contains frontend/ and backend/.

services:
  - type: web
    name: car-rental-backend
    runtime: node
    rootDir: backend
    branch: main
    autoDeploy: true
    region: frankfurt

    # Clean install from lockfile, then generate Prisma client
    buildCommand: npm ci && npx prisma generate
    startCommand: node src/server.js

    healthCheckPath: /health

    envVars:
      # Core
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: LOG_LEVEL
        value: info
      - key: NODE_VERSION
        value: "20.18.1"

      # Database
      - key: DATABASE_URL
        sync: false

      # Auth
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      # Frontend/CORS
      - key: CLIENT_URL
        sync: false

      # Stripe. Keep webhook endpoint at /api/v1/payments/webhook.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Brevo SMTP
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
