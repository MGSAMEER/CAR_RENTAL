# Render Blueprint for the backend service in this monorepo.
# Repository root contains frontend/ and backend/.
# Render must use backend/ as the service root so it installs backend/package.json.

services:
  - type: web
    name: car-rental-backend
    runtime: node
    rootDir: backend
    branch: main
    autoDeploy: true
    plan: standard
    region: frankfurt

    # Node 20 LTS pinned below via package.json engines; render.yaml version is informational.
    runtime: node@20

    # Clean install from lockfile, then generate Prisma client (runs db:generate alias)
    buildCommand: npm ci --legacy-peer-deps && npm run db:generate
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      # Core
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: LOG_LEVEL
        value: info

      # Database
      - key: DATABASE_URL
        sync: false

      # Auth
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      # Frontend/CORS
      - key: CLIENT_URL
        sync: false

      # Stripe. Keep webhook endpoint at /api/v1/payments/webhook.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Brevo SMTP
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
